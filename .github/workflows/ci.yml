name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    # Builds and smoke-tests the image on every PR; publishes it to GHCR only from main, with a signed
    # build-provenance attestation. A PR can change this file and push any tag (`:main` included), but it can't
    # produce an attestation for refs/heads/main, so homelab-infra deploys only attested images
    # (gh attestation verify --source-ref refs/heads/main --signer-workflow kielpedia/portfolio/.github/workflows/ci.yml).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: portfolio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          # Same restrictions as the homelab's k3s pods: no capabilities, no privilege escalation, read-only root.
          docker run -d --name portfolio -p 8080:8080 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp portfolio:test
          for i in $(seq 1 15); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "Kiel Loysen" || { docker logs portfolio; exit 1; }
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Attest the main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
